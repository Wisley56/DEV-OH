    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="720" height="620" fill="url(#bg)"/>
  <!-- código ao fundo -->
  <g font-family="Consolas, monospace" font-size="20" fill="#7cffb2" opacity="0.22">
    <text x="24" y="44">if (reuniao.duracao &gt; 60) { cafe++; }</text>
    <text x="24" y="74">while (bug) { ranco += 1; }</text>
    <text x="24" y="104">const hora = new Date().getHours();</text>
    <text x="24" y="134">if (hora === 18) return casa();</text>
    <text x="24" y="560">// TODO: entender o que ela pensou</text>
    <text x="24" y="590">deploy(sextaFeira); // 😱</text>
