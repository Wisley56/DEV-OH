<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="75%">
      <stop offset="0" stop-color="#3d2a7a"/>
      <stop offset="0.6" stop-color="#1b1442"/>
      <stop offset="1" stop-color="#0b0820"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b48f"/>
      <stop offset="1" stop-color="#cf9470"/>
